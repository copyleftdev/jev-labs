\* NON-VACUITY CHECK for the V4 liveness properties.
\* Asserts the negation of their antecedent. A violation proves an honest
\* stable quorum is reachable, so NoForcedEscalation was a real test.
\* EXPECTED: VIOLATED.
SPECIFICATION Spec
CONSTANTS
    Agents = {a1, a2, a3, a4, a5}
    Byzantine = {a5}
    Verdicts = {yes, no}
    Quorum = 3
    MaxAsks = 2
INVARIANTS
    NeverHonestQuorum
