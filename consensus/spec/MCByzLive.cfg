\* 5 agents, 1 forger, Q=3 (sound minimum from the sweep).
\* Checks: does a forger force escalation, flip a decision, or break the
\* monotonicity argument that explains why it cannot?
SPECIFICATION Spec
CONSTANTS
    Agents = {a1, a2, a3, a4, a5}
    Byzantine = {a5}
    Verdicts = {yes, no}
    Quorum = 3
    MaxAsks = 2
INVARIANTS
    TypeOK
    NoForcedEscalation
    NoContradictionOfHonestQuorum
    ClaimedCoversHonest
    EscalateDisabledUnderHonestQuorum
PROPERTIES
    EventuallyDecided
