\* No escalation: the protocol may only emit a real verdict.
\* EXPECTED: EventuallyDecided is VIOLATED -- jitter can starve the quorum.
SPECIFICATION Spec

CONSTANTS
    Agents = {a1, a2, a3}
    Verdicts = {yes, no}
    Quorum = 2
    MaxAsks = 2
    MaxCrashes = 1
    EnableEscalation = FALSE

INVARIANTS
    TypeOK
    DecisionIsReproducible
    EscalationIsJustified

PROPERTIES
    EventuallyDecided
