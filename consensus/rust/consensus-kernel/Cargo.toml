[package]
name = "consensus-kernel"
version = "0.1.0"
edition = "2021"
description = "Semantic consensus kernel: the Decide/Escalate state machine from a model-checked TLA+ spec"
license = "MIT"

[dependencies]
consensus-types = { path = "../consensus-types" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
ureq = { version = "2", features = ["json"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "test-util"] }
